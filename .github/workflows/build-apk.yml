name: Build KeyShortcut APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract KeyShortcut source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'KeyShortcutV2-source.zip' \
            -o -name '*KeyShortcut*source*.zip' \
          -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Could not find the KeyShortcut source ZIP."
            exit 1
          fi

          echo "Using source ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          MANIFEST="$(find extracted \
            -type f \
            -path '*/app/src/main/AndroidManifest.xml' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "::error::The source ZIP does not contain app/src/main/AndroidManifest.xml."
            exit 1
          fi

          SOURCE_APP="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"

          echo "Source app: $SOURCE_APP"

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build
          mkdir -p android-build/app/src/main

          cp -a "$SOURCE_APP/src/main/." android-build/app/src/main/

          cat > android-build/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
