name: Build KeyShortcut v3.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract KeyShortcut v3.0 source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "KEYSHORTCUT v3.0 SOURCE"
          echo "============================================================"

          ZIP="$(find . -type f \
            -name 'KeyShortcutV2-v3.0-source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Could not find KeyShortcutV2-v3.0-source.zip"
            echo
            echo "ZIP files found:"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          MANIFEST="$(find extracted \
            -type f \
            -path '*/app/src/main/AndroidManifest.xml' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not find app/src/main/AndroidManifest.xml inside the v3.0 source ZIP."
            echo
            echo "Extracted files:"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          SOURCE_APP="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"

          echo
          echo "Source app directory:"
          echo "$SOURCE_APP"

          echo
          echo "===== VERIFYING SOURCE ====="

          if [ ! -f "$SOURCE_APP/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          if [ ! -f "$SOURCE_APP/src/main/java/com/example/keyshortcut/StorageManager.kt" ]; then
            echo "::error::StorageManager.kt is missing."
            exit 1
          fi

          if ! grep -q "fun isLinked" \
            "$SOURCE_APP/src/main/java/com/example/keyshortcut/StorageManager.kt"; then
            echo "::error::StorageManager.isLinked() was not found."
            exit 1
          fi

          if [ ! -f "$SOURCE_APP/src/main/java/com/example/keyshortcut/VoiceRecorderService.kt" ]; then
            echo "::error::VoiceRecorderService.kt is missing."
            exit 1
          fi

          echo "AndroidManifest.xml: FOUND"
          echo "StorageManager.kt: FOUND"
          echo "StorageManager.isLinked(): FOUND"
          echo "VoiceRecorderService.kt: FOUND"

          echo
          echo "===== SOURCE FILES ====="
          find "$SOURCE_APP/src/main" -type f | sort

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CREATING ANDROID GRADLE PROJECT"
          echo "============================================================"

          rm -rf android-build

          mkdir -p android-build/app/src/main

          # IMPORTANT:
          # SOURCE_APP already points to the KeyShortcutV2 project folder.
          # Therefore the correct path is src/main, NOT app/src/main.
          cp -a "$SOURCE_APP/src/main/." \
            android-build/app/src/main/

          cat > android-build/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KeyShortcut"

          include(":app")
          SETTINGS

          cat > android-build/build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
          }
          ROOT

          cat > android-build/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPS

          cat > android-build/app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.keyshortcut'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.keyshortcut.test30'
                  minSdk 26
                  targetSdk 35
                  versionCode 10
                  versionName '3.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation "androidx.documentfile:documentfile:1.0.1"
          }
          APP

          if [ ! -f android-build/app/src/main/AndroidManifest.xml ]; then
              echo "::error::AndroidManifest.xml was not copied."
              exit 1
          fi

          echo
          echo "===== ANDROID PROJECT CREATED ====="

          echo "AndroidManifest.xml: FOUND"

          echo
          echo "===== ANDROID SOURCE FILES ====="
          find android-build/app/src/main -type f | sort

      - name: Build KeyShortcut v3.0
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING KEYSCHORTCUT v3.0"
          echo "============================================================"

          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"

          echo "============================================================"
          echo "VERIFYING APK"
          echo "============================================================"

          if [ ! -f "$APK" ]; then
              echo "::error::APK was not created."
              exit 1
          fi

          if [ ! -s "$APK" ]; then
              echo "::error::APK exists but is empty."
              exit 1
          fi

          unzip -t "$APK" >/dev/null

          echo "APK verification passed."

          ls -lh "$APK"

      - name: Upload KeyShortcut v3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v3.0-test-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
