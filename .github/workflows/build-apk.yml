name: Build KeyShortcut v6.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract v6 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -name 'KeyShortcutV6-v6zipsource.zip' -print -quit || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::Upload KeyShortcutV6-v6zipsource.zip to the repository root."
            find . -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          MANIFEST="$(find extracted -type f -path '*/app/src/main/AndroidManifest.xml' -print -quit || true)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::Source ZIP has no app/src/main/AndroidManifest.xml"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          SOURCE_APP="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"
          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"
          echo "Source module: $SOURCE_APP"

      - name: Verify v6 editor source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$SOURCE_APP/src/main/java/com/example/keyshortcut"

          test -f "$SOURCE_APP/src/main/AndroidManifest.xml"
          test -f "$SRC/VoiceRecorderActivity.kt"
          test -f "$SRC/RecordingStore.kt"

          grep -q 'private fun showEditor' "$SRC/VoiceRecorderActivity.kt"
          grep -q 'private fun showTrimEditor' "$SRC/VoiceRecorderActivity.kt"
          grep -q 'generatedName' "$SRC/RecordingStore.kt"

          echo 'v6 editor and transcript-title source checks passed.'

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build/app/src/main
          cp -a "$SOURCE_APP/src/main/." android-build/app/src/main/

          cat > android-build/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KeyShortcut"
          include(":app")
          SETTINGS

          cat > android-build/build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
          }
          ROOT

          cat > android-build/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPS

          cat > android-build/app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.keyshortcut'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.keyshortcut.test60'
                  minSdk 26
                  targetSdk 35
                  versionCode 13
                  versionName '6.0'
              }

              buildTypes {
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'com.alphacephei:vosk-android:0.3.75'
          }
          APP

          test -f android-build/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android-build
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v6.0-test-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
