name: Build KeyShortcut v5.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract v5 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='KeyShortcutV5-v5zipsource.zip'
          SOURCE_ZIP="$(find . -type f -name "$EXPECTED" -print -quit || true)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "Source ZIP not at repository root; checking package ZIPs..."
            rm -rf package-search
            mkdir -p package-search
            while IFS= read -r outer; do
              rm -rf package-search/*
              if unzip -q "$outer" -d package-search 2>/dev/null; then
                nested="$(find package-search -type f -name "$EXPECTED" -print -quit || true)"
                if [ -n "$nested" ]; then
                  cp "$nested" "$RUNNER_TEMP/$EXPECTED"
                  SOURCE_ZIP="$RUNNER_TEMP/$EXPECTED"
                  echo "Found nested source inside $outer"
                  break
                fi
              fi
            done < <(find . -type f -name '*.zip' -print)
          fi

          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::Could not find $EXPECTED or a package containing it."
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using: $SOURCE_ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$SOURCE_ZIP" -d extracted

          MANIFEST="$(find extracted -type f -path '*/app/src/main/AndroidManifest.xml' -print -quit || true)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::The selected ZIP does not contain app/src/main/AndroidManifest.xml"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          SOURCE_APP="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"
          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"
          echo "Android module: $SOURCE_APP"

      - name: Verify v5 recorder source
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$SOURCE_APP/src/main"

          for file in \
            "$MAIN/AndroidManifest.xml" \
            "$MAIN/java/com/example/keyshortcut/VoiceRecorderActivity.kt" \
            "$MAIN/java/com/example/keyshortcut/VoiceRecorderService.kt" \
            "$MAIN/java/com/example/keyshortcut/RecordingStore.kt" \
            "$MAIN/java/com/example/keyshortcut/TranscriptEngine.kt" \
            "$MAIN/java/com/example/keyshortcut/AudioCondensor.kt" \
            "$MAIN/java/com/example/keyshortcut/KeyComboService.kt" \
            "$MAIN/java/com/example/keyshortcut/Cfg.kt"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required v5 source missing: $file"
              exit 1
            fi
          done

          grep -q 'Quadruple tap' "$MAIN/java/com/example/keyshortcut/Cfg.kt"
          grep -q 'voice_toggle' "$MAIN/java/com/example/keyshortcut/Cfg.kt"
          grep -q 'takePersistableUriPermission' "$MAIN/java/com/example/keyshortcut/StorageManager.kt"
          echo "v5 source checks passed."

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build/app/src/main
          cp -a "$SOURCE_APP/src/main/." android-build/app/src/main/

          cat > android-build/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KeyShortcut"
          include(":app")
          SETTINGS

          cat > android-build/build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
          }
          ROOT

          cat > android-build/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPS

          cat > android-build/app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.keyshortcut'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.keyshortcut.test50'
                  minSdk 26
                  targetSdk 35
                  versionCode 12
                  versionName '5.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'com.alphacephei:vosk-android:0.3.75'
          }
          APP

          test -f android-build/app/src/main/AndroidManifest.xml
          echo "Native Android project prepared."
          find android-build/app/src/main -type f | sort

      - name: Build KeyShortcut v5.0
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verified:"
          ls -lh "$APK"

      - name: Upload v5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v5.0-test-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
