name: Build KeyShortcut APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -name 'KeyShortcutV2-source.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: KeyShortcutV2-source.zip was not found."
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract KeyShortcut source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          MAIN_DIR="$(find extracted -type d -path '*/app/src/main' | head -n 1)"

          if [ -z "$MAIN_DIR" ]; then
            echo "ERROR: Could not find app/src/main."
            echo "ZIP contents:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android source found at:"
          echo "$MAIN_DIR"

          rm -rf app
          mkdir -p app/src

          cp -R "$(dirname "$MAIN_DIR")" app/src/main

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KeyShortcut"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.keyshortcut'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.keyshortcut'
                  minSdk 26
                  targetSdk 35
                  versionCode 20
                  versionName '2.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "===== BUILDING KEYSCHORTCUT APK ====="

          gradle --no-daemon --stacktrace :app:assembleDebug

          echo "===== BUILD COMPLETE ====="

          ls -lh app/build/outputs/apk/debug/

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          echo "===== APK VERIFIED ====="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
