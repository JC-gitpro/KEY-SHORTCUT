name: Build KeyShortcut APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f -name 'KeyShortcutV2-v2.5-source.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::KeyShortcutV2-v2.5-source.zip was not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using source: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          MANIFEST="$(find extracted -type f -path '*/app/src/main/AndroidManifest.xml' -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not find app/src/main/AndroidManifest.xml"
            exit 1
          fi

          SOURCE_APP="${MANIFEST%/src/main/AndroidManifest.xml}"

          test -d "$SOURCE_APP/src/main"

          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"

          echo "Source app:"
          echo "$SOURCE_APP"

      - name: Create Gradle project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build
          mkdir -p android-build/app/src/main

          cp -R "$SOURCE_APP/src/main/." android-build/app/src/main/

          test -f android-build/app/src/main/AndroidManifest.xml

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "KeyShortcut"' \
            'include(":app")' \
            > android-build/settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id '\''com.android.application'\'' version '\''8.6.1'\'' apply false' \
            '    id '\''org.jetbrains.kotlin.android'\'' version '\''1.9.25'\'' apply false' \
            '}' \
            > android-build/build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'kotlin.code.style=official' \
            > android-build/gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id '\''com.android.application'\''' \
            '    id '\''org.jetbrains.kotlin.android'\''' \
            '}' \
            '' \
            'android {' \
            '    namespace '\''com.example.keyshortcut'\''' \
            '    compileSdk 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId '\''com.example.keyshortcut.test25'\''' \
            '        minSdk 26' \
            '        targetSdk 35' \
            '        versionCode 9' \
            '        versionName '\''2.5-storage-fix'\''' \
            '    }' \
            '' \
            '    buildTypes {' \
            '        release {' \
            '            minifyEnabled false' \
            '        }' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '' \
            '    kotlinOptions {' \
            '        jvmTarget = '\''17'\''' \
            '    }' \
            '}' \
            > android-build/app/build.gradle

          echo "Gradle project created successfully."

      - name: Build APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING KEYSKORTCUT V2.5 STORAGE FIX"
          echo "=========================================="

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VERIFIED:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v2.5-storage-fix-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
