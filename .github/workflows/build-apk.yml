name: Build KeyShortcut APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f \
            -name 'KeyShortcutV2-v2.5-source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::KeyShortcutV2-v2.5-source.zip was not found."
            echo "Files found in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 6 -type f | sort

          MANIFEST="$(find extracted \
            -type f \
            -path '*/app/src/main/AndroidManifest.xml' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not find app/src/main/AndroidManifest.xml"
            exit 1
          fi

          SOURCE_APP="${MANIFEST%/src/main/AndroidManifest.xml}"

          if [ ! -d "$SOURCE_APP/src/main" ]; then
            echo "::error::Source app directory is invalid:"
            echo "$SOURCE_APP"
            exit 1
          fi

          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"

          echo "===== SOURCE APP ====="
          echo "$SOURCE_APP"

      - name: Create Gradle project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build

          mkdir -p android-build/app/src/main

          echo "===== COPYING ANDROID SOURCE ====="

          rsync -a \
            "$SOURCE_APP/src/main/" \
            "android-build/app/src/main/"

          echo "===== VERIFYING SOURCE COPY ====="

          test -f "android-build/app/src/main/AndroidManifest.xml"

          echo "AndroidManifest.xml FOUND."

          echo "===== CREATING SETTINGS.GRADLE ====="

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "KeyShortcut"' \
            'include(":app")' \
            > android-build/settings.gradle

          echo "===== CREATING ROOT BUILD.GRADLE ====="

          printf '%s\n' \
            'plugins {' \
            '    id '\''com.android.application'\'' version '\''8.6.1'\'' apply false' \
            '    id '\''org.jetbrains.kotlin.android'\'' version '\''1.9.25'\'' apply false' \
            '}' \
            > android-build/build.gradle

          echo "===== CREATING GRADLE.PROPERTIES ====="

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'kotlin.code.style=official' \
            > android-build/gradle.properties

          echo "===== CREATING APP BUILD.GRADLE ====="

          printf '%s\n' \
            'plugins {' \
            '    id '\''com.android.application'\''' \
            '    id '\''org.jetbrains.kotlin.android'\''' \
            '}' \
            '' \
            'android {' \
            '    namespace '\''com.example.keyshortcut'\''' \
            '    compileSdk 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId '\''com.example.keyshortcut.test25'\''' \
            '        minSdk 26' \
            '        targetSdk 35' \
            '        versionCode 8' \
            '        versionName '\''2.5'\''' \
            '    }' \
            '' \
            '    buildTypes {' \
            '        release {' \
            '            minifyEnabled false' \
            '        }' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '' \
            '    kotlinOptions {' \
            '        jvmTarget = '\''17'\''' \
            '    }' \
            '}' \
            > android-build/app/build.gradle

          echo "===== FINAL PROJECT CHECK ====="

          test -f android-build/settings.gradle
          test -f android-build/build.gradle
          test -f android-build/gradle.properties
          test -f android-build/app/build.gradle
          test -f android-build/app/src/main/AndroidManifest.xml

          echo "All required Gradle files exist."

          echo "===== SOURCE FILES ====="
          find android-build/app/src/main -type f | sort

      - name: Build APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING KEYSKORTCUT V2.5"
          echo "=============================================="

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty."
            exit 1
          fi

          unzip -t "$APK" >/dev/null

          echo "=============================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=============================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v2.5-test-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
