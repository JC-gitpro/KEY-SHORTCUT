name: Build KeyShortcut APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract KeyShortcut v2.5 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \( \
            -name 'KeyShortcutV2-v2.5-source.zip' \
            -o -name 'KeyShortcutV2-source-v2.5.zip' \
            -o -name '*KeyShortcut*v2.5*source*.zip' \
          \) -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Could not find the KeyShortcut v2.5 source ZIP."
            exit 1
          fi

          echo "Using source ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          MANIFEST="$(find extracted \
            -type f \
            -path '*/app/src/main/AndroidManifest.xml' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "::error::The source ZIP does not contain app/src/main/AndroidManifest.xml."
            exit 1
          fi

          SOURCE_APP="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

          echo "SOURCE_APP=$SOURCE_APP" >> "$GITHUB_ENV"
          echo "Source app: $SOURCE_APP"

      - name: Create native Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build
          mkdir -p android-build/app/src/main

          cp -a "$SOURCE_APP/src/main/." android-build/app/src/main/

          cat > android-build/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KeyShortcut"
          include(":app")
          SETTINGS

          cat > android-build/build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
          }
          ROOT

          cat > android-build/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPS

          cat > android-build/app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.keyshortcut'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.keyshortcut.test25'
                  minSdk 26
                  targetSdk 35
                  versionCode 8
                  versionName '2.5'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          APP

          if [ ! -f android-build/app/src/main/AndroidManifest.xml ]; then
              echo "::error::AndroidManifest.xml was not copied."
              exit 1
          fi

          echo "AndroidManifest.xml FOUND."

          echo "===== SOURCE FILES ====="
          find android-build/app/src/main -type f | sort

      - name: Build debug APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILDING KEYSCHORTCUT V2.5 TEST APK ====="

          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
              echo "::error::APK was not created."
              exit 1
          fi

          unzip -t "$APK" >/dev/null

          echo "===== APK VERIFIED ====="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyShortcut-v2.5-test-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
